dataset:
  type: "h5"
  root: "/data/WiFiPose/dataset/mmfi_pose.h5"
  split: "same_subject_random"
  envs: ["env3"]
  train_subjects: ["S21", "S22", "S23", "S24", "S25", "S26", "S27", "S28", "S29", "S30"]
  test_subjects: ["S21", "S22", "S23", "S24", "S25", "S26", "S27", "S28", "S29", "S30"]
  random_val_ratio: 0.2
  seed: 42

csi:
  time_packets: 64
  rx_antennas: 3
  subcarriers: 114
  subcarrier_mode: "keep"
  normalize: "global_minmax"
  amp_key: "CSIamp"

heatmap:
  size: 36
  sigma: 1.5
  paf_width: 1.0
  pose_min: -0.8
  pose_max: 0.8

model:
  embed_dim: 1296
  num_heads: 8
  depth: 8
  dropout: 0.1
  recon_channels: 64
  feature_channels: 128
  decoder_hidden: 512
  stages: 3

train:
  epochs: 100
  batch_size: 32
  lr: 0.001
  lr_step: 15
  lr_gamma: 0.7
  num_workers: 4
  device: "cuda"
  output_dir: "outputs/E03"
  log_every: 20
  save_every: 5
  early_stop_min_delta: 0.0
  early_stop_patience: 1
  early_stop_warmup: 3

eval:
  batch_size: 32
  pck_thresholds: [0.2, 0.3, 0.4]
  peak_threshold: 0.1

visualize:
  n_per_env: 8
  seed: 123
