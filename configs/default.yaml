# 默认配置 = E01 单环境实验。
# 4 个环境分别独立训练，详见 configs/E0{1..4}.yaml；不做跨域。
dataset:
  root: "/data/WiFiPose/dataset/mmfi_pose.h5"
  split_scheme: "action_env"     # action_env, frame_random
  envs: ["env1"]
  val_split: "val"
  test_split: "test"
  seed: 42
  max_samples: null

csi:
  time_packets: 64
  rx_antennas: 3
  subcarriers: 114
  subcarrier_mode: "keep"  # keep, learned64, resample64
  normalize: "zscore"      # zscore, minmax, none
  amp_key: "CSIamp"

heatmap:
  size: 36
  sigma: 1.5
  paf_width: 1.0
  pose_min: -0.8
  pose_max: 0.8

model:
  embed_dim: 1296
  num_heads: 8
  depth: 8
  dropout: 0.1
  recon_channels: 64
  feature_channels: 128
  decoder_hidden: 512
  stages: 3

train:
  epochs: 100
  batch_size: 32
  lr: 0.001
  lr_step: 15
  lr_gamma: 0.7
  num_workers: 4
  device: "cuda"
  output_dir: "outputs"
  log_every: 20
  save_every: 5

eval:
  batch_size: 32
  pck_thresholds: [0.2, 0.3, 0.4]
  peak_threshold: 0.1

visualize:
  n_per_env: 8
  seed: 123
